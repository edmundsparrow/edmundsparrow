<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gnoke CMS — Insights & Stories</title>
    <link rel="icon" type="image/svg+xml" href="assets/gnoke-mark.svg">
    <meta name="description" content="Gnoke CMS — the latest stories, insights, and updates.">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="logo-header">
                <a href="index.html">
                    <img src="assets/gnoke-mark.svg" alt="Gnoke CMS logo" width="48" height="48">
                </a>
                <span>Gnoke CMS</span>
            </div>
            <h1 class="site-title">Insights & Stories</h1>
            <p class="site-subtitle">The latest articles, updates, and ideas — all in one place.</p>
        </div>
    </header>

    <nav class="site-nav">
        <div class="container nav-content">
            <ul class="nav-links">
                <li><a href="index.html" class="active">All Posts</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <a href="https://github.com/edmundsparrow" target="_blank" rel="noopener" style="color:#64748b; text-decoration:none; font-size:0.9rem;">GitHub →</a>
        </div>
    </nav>

    <main class="blog-main">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Latest Articles</h2>
            </div>

            <div id="postsGrid" class="posts-grid">
                <p class="state-message">Loading posts…</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Gnoke CMS</p>
            <p class="footer-tagline">Built as a lightweight, backend-free CMS demo (IndexedDB).</p>
        </div>
    </footer>

    <script src="js/db.js"></script>
    <script src="js/devto-sync.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/site.js"></script>
</body>
</html>
